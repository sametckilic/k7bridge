name: K7Bridge
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 0.2.1
targets:
  K7Bridge:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources/Assets.xcassets]
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/K7Bridge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.K7Bridge
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [K7BridgeTests]
  K7BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: K7Bridge
