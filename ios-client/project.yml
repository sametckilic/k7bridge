name: K7Bridge
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 0.4.1
targets:
  K7Bridge:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: K7Bridge
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.K7Bridge.pairing
            CFBundleURLSchemes: [k7bridge]
        UILaunchScreen: {}
        NSCameraUsageDescription: Gateway eşleştirme QR kodunu taramak için kamera kullanılır.
        NSContactsUsageDescription: Arayan kişilerin adını göstermek ve rehberden numara seçmek için rehber kullanılır.
        NSMicrophoneUsageDescription: GSM görüşmesinde sesinizi eski iPhone üzerinden karşı tarafa iletmek için mikrofon kullanılır.
        NSLocalNetworkUsageDescription: GSM gateway ile çağrı, ses, SMS ve durum verisi alışverişi yapılır.
        NSBonjourServices: [_k7bridge._tcp]
        UIBackgroundModes: [voip, audio, remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: Resources/K7Bridge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.K7Bridge
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 13
        MARKETING_VERSION: 0.4.1
    scheme:
      testTargets: [K7BridgeTests]
  K7BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: K7Bridge
