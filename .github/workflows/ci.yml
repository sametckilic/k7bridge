name: CI
on:
  push:
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios-client
      - name: Compile app and tests for iOS Simulator without signing
        working-directory: ios-client
        run: >-
          xcodebuild -project K7Bridge.xcodeproj -scheme K7Bridge
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/K7CIDerivedData"
          CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Verify modern iPhone bundle metadata
        run: |
          app="$RUNNER_TEMP/K7CIDerivedData/Build/Products/Debug-iphonesimulator/K7Bridge.app"
          info="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "0.3.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = "10"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$info" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSContactsUsageDescription' "$info" >/dev/null
          test -f "$app/Assets.car"
