name: CI
on:
  push:
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios-client
      - name: Build without signing
        working-directory: ios-client
        run: >-
          xcodebuild -project K7Bridge.xcodeproj -scheme K7Bridge
          -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16'
          CODE_SIGNING_ALLOWED=NO build test

